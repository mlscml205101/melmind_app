# Tek komut:  docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: melmind
      MYSQL_DATABASE: melmind
    volumes:
      - melmind-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmelmind"]
      interval: 3s
      timeout: 3s
      retries: 40

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ANTHROPIC_API_KEY, JWT_SECRET, AI_MODEL değerleri server/.env dosyasından okunur
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: melmind
      DB_NAME: melmind
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  melmind-db:
